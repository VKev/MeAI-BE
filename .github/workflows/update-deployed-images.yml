name: Update Deployed EKS Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to use."
        type: string
        default: infrastructure-khanghv2406
        required: true
      services:
        description: "Comma-separated service folders to update, or all."
        type: string
        default: all
        required: true
      fresh_start_confirmation:
        description: "Destructive: type DELETE_DEPLOYED_DATA to erase all namespace PVC data before rollout."
        type: string
        default: ""
        required: true
      delete_rds_data:
        description: "Also delete all tables in Terraform-defined RDS databases before restarting EKS services."
        type: boolean
        default: false
        required: true
      rds_data_confirmation:
        description: "Required when delete_rds_data is true: type DELETE_RDS_DATA."
        type: string
        default: ""
        required: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || '' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || '' }}
  ECR_REPO_NAME: ${{ vars.ECR_REPO_NAME || '' }}

permissions:
  contents: read

jobs:
  discover-services:
    name: Discover Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.get-services.outputs.services }}
      service_count: ${{ steps.get-services.outputs.service_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require destructive fresh-start confirmation
        env:
          FRESH_START_CONFIRMATION: ${{ inputs.fresh_start_confirmation }}
        run: |
          set -euo pipefail
          if [ "$FRESH_START_CONFIRMATION" != "DELETE_DEPLOYED_DATA" ]; then
            echo "Refusing destructive rollout. Set fresh_start_confirmation to DELETE_DEPLOYED_DATA." >&2
            exit 1
          fi

      - name: Require destructive RDS confirmation
        if: ${{ inputs.delete_rds_data }}
        env:
          RDS_DATA_CONFIRMATION: ${{ inputs.rds_data_confirmation }}
        run: |
          set -euo pipefail
          if [ "$RDS_DATA_CONFIRMATION" != "DELETE_RDS_DATA" ]; then
            echo "Refusing RDS data wipe. Set rds_data_confirmation to DELETE_RDS_DATA." >&2
            exit 1
          fi

      - name: Discover selected microservices
        id: get-services
        env:
          REQUESTED_SERVICES: ${{ inputs.services }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          base = Path("Backend/Microservices")
          services = []
          if base.exists():
              for item in sorted(base.iterdir()):
                  if not item.is_dir() or item.name.lower() == "sharedlibrary":
                      continue
                  if any((item / name).is_file() for name in ("Dockerfile", "dockerfile", "DockerFile")):
                      services.append(item.name)

          requested_raw = os.environ.get("REQUESTED_SERVICES", "all").strip()
          if requested_raw and requested_raw.lower() != "all":
              requested = [part.strip() for part in requested_raw.split(",") if part.strip()]
              by_lower = {service.lower(): service for service in services}
              selected = []
              missing = []
              for service in requested:
                  match = by_lower.get(service.lower())
                  if match:
                      selected.append(match)
                  else:
                      missing.append(service)
              if missing:
                  raise SystemExit(f"Requested service(s) not found or missing Dockerfile: {', '.join(missing)}")
              services = selected

          services_json = json.dumps(services)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"services={services_json}\n")
              output.write(f"service_count={len(services)}\n")
          print(f"Selected services: {services_json}")
          PY

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: discover-services
    if: ${{ needs.discover-services.outputs.services != '[]' }}
    environment:
      name: ${{ inputs.environment }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge tfvars for build settings
        working-directory: Terraform
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          cp ../Terraform-vars/*.auto.tfvars . 2>/dev/null || true
          cp ../terraform-vars/*.auto.tfvars . 2>/dev/null || true
          cp ../terraform-var/*.auto.tfvars . 2>/dev/null || true

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          echo "$SECRETS_JSON" \
            | jq -r 'to_entries[] | select(.key | startswith("TERRAFORM_VARS_")) | .key' \
            | while read -r key; do
                suffix=${key#TERRAFORM_VARS_}
                norm=$(echo "$suffix" \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed 's/^\s\+//;s/\s\+$//' \
                  | tr ' /\\' '___' )
                value=$(jq -r --arg k "$key" '.[$k]' <<< "$SECRETS_JSON")
                if echo "$value" | jq -e . >/dev/null 2>&1; then
                  case "$norm" in
                    *.auto.tfvars.json|*.tfvars.json) filename="$norm";;
                    *.auto.tfvars|*.tfvars)           filename="$norm.json";;
                    *)                                 filename="$norm.auto.tfvars.json";;
                  esac
                else
                  case "$norm" in
                    *.auto.tfvars|*.tfvars)           filename="$norm";;
                    *.auto.tfvars.json|*.tfvars.json) filename="${norm%.json}";;
                    *)                                 filename="$norm.auto.tfvars";;
                  esac
                fi
                printf '%s' "$value" > "$filename"
              done

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pip >/dev/null
          python3 -m pip install --user python-hcl2 >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/merge_tfvars.py

          for f in *.auto.tfvars *.auto.tfvars.json; do
            [ "$f" = "00-all.auto.tfvars.json" ] && continue || true
            rm -f "$f" || true
          done

      - name: Load project/region from Terraform vars
        run: python Terraform/scripts/export_tf_env.py >> "$GITHUB_ENV"
        env:
          TF_ENV_FALLBACK_PROJECT: ${{ env.PROJECT_NAME }}
          TF_ENV_FALLBACK_REGION: ${{ env.AWS_REGION }}

      - name: Ensure AWS region fallback
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          fi

      - name: Derive ECR repo name from Terraform vars
        run: |
          REPO="${{ env.ECR_REPO_NAME }}"
          if [ -z "$REPO" ] || [ "$REPO" = "default" ]; then
            if [ -f Terraform/00-all.auto.tfvars.json ]; then
              REPO_FROM_TFVARS=$(jq -r '
                def repo_name:
                  if type == "string" and test("/") then split("/")[-1] else empty end;
                [
                  try (.services.user.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.services.apigateway.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.services.ai.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.k8s_microservices_manifest | capture("image:\\s+[^\\s/]+/(?<repo>[^\\s:]+):(Ai\\.Microservice|User\\.Microservice|ApiGateway|Notification\\.Microservice|Feed\\.Microservice|Rag\\.Microservice)-latest").repo) catch empty
                ] | map(select(. != "" and . != "null")) | .[0] // ""
              ' Terraform/00-all.auto.tfvars.json)
            else
              REPO_FROM_TFVARS=""
            fi
            REPO="${REPO_FROM_TFVARS:-${PROJECT_NAME:-default}-${{ inputs.environment }}-ecr}"
          fi
          echo "ECR_REPO_NAME=$REPO" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: set-tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Repository $ECR_REPO_NAME already exists."
          else
            create_output=$(aws ecr create-repository --repository-name "$ECR_REPO_NAME" --region "$AWS_REGION" 2>&1) || {
              if echo "$create_output" | grep -q "RepositoryAlreadyExistsException"; then
                echo "Repository $ECR_REPO_NAME was created by another matrix job."
              else
                echo "$create_output" >&2
                exit 1
              fi
            }
          fi

      - name: Detect Dockerfile path
        id: dockerfile
        run: |
          BASE="Backend/Microservices/${{ matrix.service }}"
          for name in Dockerfile dockerfile DockerFile; do
            if [ -f "$BASE/$name" ]; then
              echo "path=$BASE/$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No Dockerfile found under $BASE" >&2
          exit 1

      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        with:
          context: Backend/Microservices
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ matrix.service }}-${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ matrix.service }}-latest
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ matrix.service }}-cache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.service }}
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:${{ matrix.service }}-cache,mode=max
          platforms: linux/amd64

  rollout:
    name: Roll Out to Existing EKS Deployments
    runs-on: ubuntu-latest
    needs: [discover-services, build-and-push]
    if: ${{ needs.build-and-push.result == 'success' }}
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Merge tfvars for rollout settings
        working-directory: Terraform
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          cp ../Terraform-vars/*.auto.tfvars . 2>/dev/null || true
          cp ../terraform-vars/*.auto.tfvars . 2>/dev/null || true
          cp ../terraform-var/*.auto.tfvars . 2>/dev/null || true

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          echo "$SECRETS_JSON" \
            | jq -r 'to_entries[] | select(.key | startswith("TERRAFORM_VARS_")) | .key' \
            | while read -r key; do
                suffix=${key#TERRAFORM_VARS_}
                norm=$(echo "$suffix" \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed 's/^\s\+//;s/\s\+$//' \
                  | tr ' /\\' '___' )
                value=$(jq -r --arg k "$key" '.[$k]' <<< "$SECRETS_JSON")
                if echo "$value" | jq -e . >/dev/null 2>&1; then
                  case "$norm" in
                    *.auto.tfvars.json|*.tfvars.json) filename="$norm";;
                    *.auto.tfvars|*.tfvars)           filename="$norm.json";;
                    *)                                 filename="$norm.auto.tfvars.json";;
                  esac
                else
                  case "$norm" in
                    *.auto.tfvars|*.tfvars)           filename="$norm";;
                    *.auto.tfvars.json|*.tfvars.json) filename="${norm%.json}";;
                    *)                                 filename="$norm.auto.tfvars";;
                  esac
                fi
                printf '%s' "$value" > "$filename"
              done

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pip >/dev/null
          python3 -m pip install --user python-hcl2 >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/merge_tfvars.py

          for f in *.auto.tfvars *.auto.tfvars.json; do
            [ "$f" = "00-all.auto.tfvars.json" ] && continue || true
            rm -f "$f" || true
          done

      - name: Load project/region from Terraform vars
        run: python Terraform/scripts/export_tf_env.py >> "$GITHUB_ENV"
        env:
          TF_ENV_FALLBACK_PROJECT: ${{ env.PROJECT_NAME }}
          TF_ENV_FALLBACK_REGION: ${{ env.AWS_REGION }}

      - name: Ensure AWS region fallback
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          fi

      - name: Derive ECR repo name from Terraform vars
        run: |
          REPO="${{ env.ECR_REPO_NAME }}"
          if [ -z "$REPO" ] || [ "$REPO" = "default" ]; then
            if [ -f Terraform/00-all.auto.tfvars.json ]; then
              REPO_FROM_TFVARS=$(jq -r '
                def repo_name:
                  if type == "string" and test("/") then split("/")[-1] else empty end;
                [
                  try (.services.user.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.services.apigateway.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.services.ai.ecs_container_image_repository_url | repo_name) catch empty,
                  try (.k8s_microservices_manifest | capture("image:\\s+[^\\s/]+/(?<repo>[^\\s:]+):(Ai\\.Microservice|User\\.Microservice|ApiGateway|Notification\\.Microservice|Feed\\.Microservice|Rag\\.Microservice)-latest").repo) catch empty
                ] | map(select(. != "" and . != "null")) | .[0] // ""
              ' Terraform/00-all.auto.tfvars.json)
            else
              REPO_FROM_TFVARS=""
            fi
            REPO="${REPO_FROM_TFVARS:-${PROJECT_NAME:-default}-${{ inputs.environment }}-ecr}"
          fi
          echo "ECR_REPO_NAME=$REPO" >> "$GITHUB_ENV"

      - name: Resolve cluster and namespace
        run: |
          set -euo pipefail

          project_slug=$(printf '%s' "$PROJECT_NAME" | tr '_' '-')
          prefix=$(printf '%s' "$project_slug" | cut -c1-18)
          hash=$(printf '%s' "$PROJECT_NAME" | md5sum | cut -c1-4)
          CLUSTER_NAME="${prefix}-${hash}-eks"
          K8S_NAMESPACE="$PROJECT_NAME"

          echo "EKS_CLUSTER_NAME=$CLUSTER_NAME" >> "$GITHUB_ENV"
          echo "K8S_NAMESPACE=$K8S_NAMESPACE" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubeconfig
        run: |
          aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Update deployment images
        env:
          SERVICES: ${{ needs.discover-services.outputs.services }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SKIP_MISSING_DEPLOYMENTS: "false"
          ROLLOUT_TIMEOUT: 15m
          RUN_STAMP: ${{ github.run_id }}-${{ github.run_attempt }}
          DELETE_RDS_DATA: ${{ inputs.delete_rds_data }}
          RDS_DATA_CONFIRMATION: ${{ inputs.rds_data_confirmation }}
        run: |
          set -euo pipefail

          map_service() {
            case "$1" in
              User.Microservice) echo "10 user-microservice user-microservice" ;;
              Notification.Microservice) echo "20 notification-microservice notification-microservice" ;;
              Feed.Microservice) echo "30 feed-microservice feed-microservice" ;;
              Rag.Microservice) echo "40 rag-microservice rag-microservice" ;;
              Ai.Microservice) echo "50 ai-microservice ai-microservice" ;;
              ApiGateway) echo "90 api-gateway api-gateway" ;;
              *) echo "" ;;
            esac
          }

          plan_file="$(mktemp)"
          unsorted_plan="$(mktemp)"
          strategy_dir="$(mktemp -d)"
          replica_file="$(mktemp)"
          pvc_snapshot="$(mktemp)"
          pvc_manifest="$(mktemp)"
          prepull_name="meai-prepull-${RUN_STAMP}"
          prepull_manifest="$(mktemp)"

          restore_strategies() {
            for strategy_file in "$strategy_dir"/*.json; do
              [ -e "$strategy_file" ] || continue
              deployment="$(basename "$strategy_file" .json)"
              payload="$(jq -c '[{op:"replace",path:"/spec/strategy",value:.}]' "$strategy_file")"
              kubectl -n "$K8S_NAMESPACE" patch deployment "$deployment" --type json -p "$payload" >/dev/null 2>&1 || true
            done
          }

          restore_replicas() {
            [ -s "$replica_file" ] || return 0
            while IFS=$'\t' read -r deployment replicas; do
              kubectl -n "$K8S_NAMESPACE" scale deployment "$deployment" --replicas="$replicas" >/dev/null 2>&1 || true
            done < "$replica_file"
          }

          cleanup_prepull() {
            kubectl -n "$K8S_NAMESPACE" delete daemonset "$prepull_name" --ignore-not-found --wait=false >/dev/null 2>&1 || true
          }

          erase_rds_data() {
            if [ "$DELETE_RDS_DATA" != "true" ]; then
              echo "RDS data wipe disabled."
              return 0
            fi

            if [ "$RDS_DATA_CONFIRMATION" != "DELETE_RDS_DATA" ]; then
              echo "Refusing RDS data wipe. Set rds_data_confirmation to DELETE_RDS_DATA." >&2
              exit 1
            fi

            if [ ! -f Terraform/00-all.auto.tfvars.json ]; then
              echo "Merged Terraform vars file was not found; cannot derive RDS targets." >&2
              exit 1
            fi

            rds_plan="$(mktemp)"
            jq -r --arg project "$PROJECT_NAME" '
              ($project) as $projectName |
              (.rds // {}) | to_entries[] |
              .key as $service |
              .value as $cfg |
              (($cfg.db_names // (if (($cfg.db_name // "") != "") then [$cfg.db_name] else ["defaultdb"] end))
                | map(select(type == "string" and length > 0))
                | unique) as $rawDbNames |
              (if ($rawDbNames | length) > 0 then $rawDbNames else ["defaultdb"] end) as $dbNames |
              ($cfg.db_name // ($dbNames[0] // "defaultdb")) as $primaryDbName |
              {
                service: $service,
                identifier: ($projectName + "-" + $service + "-" + $primaryDbName + "-db"),
                username: ($cfg.username // "avnadmin"),
                password: ($cfg.password // ""),
                databases: $dbNames
              } | @base64
            ' Terraform/00-all.auto.tfvars.json > "$rds_plan"

            if [ ! -s "$rds_plan" ]; then
              echo "No Terraform-defined RDS databases found; skipping RDS wipe."
              echo "RDS data reset skipped: no Terraform-defined RDS databases." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            postgres_client_image="$(jq -r --arg registry "$ECR_REGISTRY" \
              '$registry + "/" + (.dockerhub_pull_through_prefix // "dockerhub") + "/library/postgres:16-alpine"' \
              Terraform/00-all.auto.tfvars.json)"

            echo "Deleting all tables in Terraform-defined RDS databases before restarting EKS services..."
            rds_instance_count=0
            rds_database_count=0

            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              row="$(printf '%s' "$encoded" | base64 -d)"
              service="$(jq -r '.service' <<< "$row")"
              identifier="$(jq -r '.identifier' <<< "$row")"
              username="$(jq -r '.username' <<< "$row")"
              password="$(jq -r '.password' <<< "$row")"

              if [ -z "$password" ] || [ "$password" = "null" ]; then
                echo "RDS password for service '$service' is empty in merged Terraform vars. Refusing to wipe '$identifier'." >&2
                exit 1
              fi
              echo "::add-mask::$password"

              endpoint_json="$(aws rds describe-db-instances \
                --region "$AWS_REGION" \
                --db-instance-identifier "$identifier" \
                --query 'DBInstances[0].Endpoint' \
                --output json)"
              host="$(jq -r '.Address // empty' <<< "$endpoint_json")"
              port="$(jq -r '.Port // 5432' <<< "$endpoint_json")"

              if [ -z "$host" ]; then
                echo "Unable to resolve RDS endpoint for '$identifier'." >&2
                exit 1
              fi

              rds_instance_count=$((rds_instance_count + 1))

              while read -r database; do
                case "$database" in
                  ""|"null"|"postgres"|"template0"|"template1")
                    echo "Refusing to erase system or empty database name '$database' on '$identifier'." >&2
                    exit 1
                    ;;
                esac
                if ! [[ "$database" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                  echo "Refusing to erase database '$database' on '$identifier' because the name is not a simple PostgreSQL identifier." >&2
                  exit 1
                fi
                if ! [[ "$username" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                  echo "Refusing to use RDS username '$username' on '$identifier' because the name is not a simple PostgreSQL identifier." >&2
                  exit 1
                fi

                safe_suffix="$(printf '%s-%s' "$service" "$database" \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//' \
                  | cut -c1-24)"
                pod_name="$(printf 'meai-rds-wipe-%s-%s' "$RUN_STAMP" "$safe_suffix" | cut -c1-63 | sed 's/-$//')"

                echo "Deleting all tables in RDS database '$database' on instance '$identifier'..."
                kubectl -n "$K8S_NAMESPACE" run "$pod_name" \
                  --rm -i \
                  --attach=true \
                  --restart=Never \
                  --image="$postgres_client_image" \
                  --env="PGHOST=$host" \
                  --env="PGPORT=$port" \
                  --env="PGUSER=$username" \
                  --env="PGPASSWORD=$password" \
                  --env="TARGET_DB=$database" \
                  --command -- sh -ceu '
                    psql -v ON_ERROR_STOP=1 -d postgres \
                      -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = \$\$${TARGET_DB}\$\$ AND pid <> pg_backend_pid();"
                    psql -v ON_ERROR_STOP=1 \
                      -d "$TARGET_DB" \
                      -c "
                        DO \$meai_wipe\$
                        DECLARE
                          schema_name text;
                        BEGIN
                          FOR schema_name IN
                            SELECT nspname
                            FROM pg_namespace
                            WHERE nspname <> \$\$information_schema\$\$
                              AND nspname NOT LIKE \$\$pg_%\$\$
                          LOOP
                            EXECUTE format(\$\$DROP SCHEMA IF EXISTS %I CASCADE\$\$, schema_name);
                          END LOOP;

                          CREATE SCHEMA public AUTHORIZATION CURRENT_USER;
                          GRANT ALL ON SCHEMA public TO PUBLIC;
                          GRANT ALL ON SCHEMA public TO CURRENT_USER;
                        END
                        \$meai_wipe\$;
                      "
                  '
                rds_database_count=$((rds_database_count + 1))
              done < <(jq -r '.databases[]' <<< "$row")
            done < "$rds_plan"

            echo "RDS data reset complete: deleted all tables in $rds_database_count database(s) across $rds_instance_count RDS instance(s)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          cleanup() {
            cleanup_prepull
            restore_replicas
            restore_strategies
          }
          trap cleanup EXIT

          echo "## EKS Image Rollout" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Deployment | Image | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|------------|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          echo "$SERVICES" | jq -r '.[]' | while read -r service; do
            mapping=$(map_service "$service")
            if [ -z "$mapping" ]; then
              echo "No deployment mapping exists for service $service" >&2
              exit 1
            fi

            order=$(echo "$mapping" | awk '{print $1}')
            deployment=$(echo "$mapping" | awk '{print $2}')
            container=$(echo "$mapping" | awk '{print $3}')
            image="${ECR_REGISTRY}/${ECR_REPO_NAME}:${service}-${IMAGE_TAG}"

            if ! kubectl -n "$K8S_NAMESPACE" get deployment "$deployment" >/dev/null 2>&1; then
              if [ "$SKIP_MISSING_DEPLOYMENTS" = "true" ]; then
                echo "| $service | $deployment | $image | skipped: deployment missing |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              echo "Deployment $deployment does not exist in namespace $K8S_NAMESPACE" >&2
              exit 1
            fi

            if ! kubectl -n "$K8S_NAMESPACE" get deployment "$deployment" -o json \
              | jq -e --arg container "$container" '.spec.template.spec.containers[] | select(.name == $container)' >/dev/null; then
              echo "Container $container does not exist in deployment $deployment" >&2
              exit 1
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' "$order" "$service" "$deployment" "$container" "$image" >> "$unsorted_plan"
          done

          sort -n "$unsorted_plan" > "$plan_file"

          if [ ! -s "$plan_file" ]; then
            echo "No deployments selected for rollout."
            exit 0
          fi

          echo "Scaling namespace deployments to zero before deleting persistent data..."
          kubectl -n "$K8S_NAMESPACE" get deployments -o json \
            | jq -r '.items[] | [.metadata.name, (.spec.replicas // 1)] | @tsv' \
            > "$replica_file"

          while IFS=$'\t' read -r deployment _; do
            kubectl -n "$K8S_NAMESPACE" scale deployment "$deployment" --replicas=0
          done < "$replica_file"

          kubectl -n "$K8S_NAMESPACE" delete pods --all --wait=true --timeout=5m

          erase_rds_data

          echo "Snapshotting and deleting all namespace PVCs..."
          kubectl -n "$K8S_NAMESPACE" get pvc -o json > "$pvc_snapshot"
          pvc_count="$(jq '.items | length' "$pvc_snapshot")"

          if [ "$pvc_count" -gt 0 ]; then
            jq '{
              apiVersion: "v1",
              kind: "List",
              items: [
                .items[] | {
                  apiVersion: "v1",
                  kind: "PersistentVolumeClaim",
                  metadata: {
                    name: .metadata.name,
                    namespace: .metadata.namespace,
                    labels: (.metadata.labels // {})
                  },
                  spec: (.spec | del(.volumeName))
                }
              ]
            }' "$pvc_snapshot" > "$pvc_manifest"

            kubectl -n "$K8S_NAMESPACE" delete pvc --all --wait=true --timeout=10m
            kubectl -n "$K8S_NAMESPACE" apply -f "$pvc_manifest"

          else
            echo "No PVCs exist in namespace $K8S_NAMESPACE."
          fi

          echo "Fresh-start storage reset complete: deleted and recreated $pvc_count PVC(s)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Preparing no-surge rollout strategy for selected deployments..."
          while IFS=$'\t' read -r _ service deployment container image; do
            kubectl -n "$K8S_NAMESPACE" get deployment "$deployment" -o json | jq '.spec.strategy' > "$strategy_dir/$deployment.json"
            kubectl -n "$K8S_NAMESPACE" patch deployment "$deployment" --type json -p \
              '[{"op":"replace","path":"/spec/strategy","value":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}]' >/dev/null
            echo "Prepared $deployment for no-surge rollout."
          done < "$plan_file"

          echo "Pre-pulling selected images on every schedulable node..."
          containers_json="$(jq -Rn '
              [inputs | select(length > 0) | split("\t") |
                {
                  name: ("pull-" + (.[1] | ascii_downcase | gsub("[^a-z0-9-]"; "-") | gsub("-+"; "-") | sub("^-"; "") | sub("-$"; ""))),
                  image: .[4],
                  imagePullPolicy: "Always",
                  command: ["/bin/sh", "-c", "sleep 300"],
                  resources: {
                    requests: { cpu: "5m", memory: "16Mi" },
                    limits: { cpu: "25m", memory: "64Mi" }
                  }
                }
              ]' < "$plan_file")"

          jq -n \
            --arg name "$prepull_name" \
            --argjson containers "$containers_json" \
            '{
                apiVersion: "apps/v1",
                kind: "DaemonSet",
                metadata: {
                  name: $name,
                  labels: {
                    "app.kubernetes.io/name": "meai-image-prepull",
                    "app.kubernetes.io/managed-by": "github-actions"
                  }
                },
                spec: {
                  selector: { matchLabels: { name: $name } },
                  template: {
                    metadata: { labels: { name: $name } },
                    spec: {
                      terminationGracePeriodSeconds: 0,
                      tolerations: [ { operator: "Exists" } ],
                      containers: $containers
                    }
                  }
                }
            }' > "$prepull_manifest"

          kubectl -n "$K8S_NAMESPACE" apply -f "$prepull_manifest"
          kubectl -n "$K8S_NAMESPACE" rollout status "daemonset/$prepull_name" --timeout=5m
          echo "Image pre-pull completed."

          while IFS=$'\t' read -r _ service deployment container image; do
            echo "Updating $deployment/$container to $image"
            patch_payload="$(jq -nc \
              --arg container "$container" \
              --arg image "$image" \
              --arg stamp "${RUN_STAMP}-${service}" \
              '{
                spec: {
                  template: {
                    metadata: {
                      annotations: {
                        "meai.dev/image-update-run": $stamp
                      }
                    },
                    spec: {
                      containers: [
                        {
                          name: $container,
                          image: $image,
                          imagePullPolicy: "Always"
                        }
                      ]
                    }
                  }
                }
              }')"

            kubectl -n "$K8S_NAMESPACE" patch deployment "$deployment" --type strategic -p "$patch_payload"
          done < "$plan_file"

          echo "Restoring deployment replica counts..."
          restore_replicas

          if [ "$pvc_count" -gt 0 ]; then
            kubectl -n "$K8S_NAMESPACE" get pvc -o name | while read -r claim; do
              kubectl -n "$K8S_NAMESPACE" wait --for=jsonpath='{.status.phase}'=Bound "$claim" --timeout=10m
            done
          fi

          while IFS=$'\t' read -r deployment replicas; do
            if [ "$replicas" -gt 0 ]; then
              kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$deployment" --timeout="$ROLLOUT_TIMEOUT"
            fi
          done < "$replica_file"

          while IFS=$'\t' read -r _ service deployment container image; do
            echo "| $service | $deployment | $image | fresh-start rollout complete |" >> "$GITHUB_STEP_SUMMARY"
          done < "$plan_file"
